name: Build MenuAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang library
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.12.0 PySide6-WebEngine==6.12.0.140 pyinstaller

      - name: Build MenuAI
        run: |
          $icon = @()
          if (Test-Path icon.ico) { $icon = @('--icon', 'icon.ico') }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MenuAI @icon menu_ai.py

      - name: Simpan hasil build
        uses: actions/upload-artifact@v4
        with:
          name: MenuAI
          path: dist
          retention-days: 30
