name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE
      run: |
        pyinstaller --noconfirm --windowed --name "MenuAI" --icon "icon.ico" --collect-all PySide6 menu_ai.py

    - name: Zip App
      run: |
        Compress-Archive -Path dist/MenuAI/* -DestinationPath MenuAI-Build.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenuAI-Artifact
        path: MenuAI-Build.zip
